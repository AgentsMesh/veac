[package]
name = "veac-evidence"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
png = "0.17"
tempfile = "3"
veac-ir = { path = "../veac-ir" }
veac-lang = { path = "../veac-lang" }
veac-runtime = { path = "../veac-runtime" }

[dev-dependencies]
veac-artifact = { path = "../veac-artifact" }
