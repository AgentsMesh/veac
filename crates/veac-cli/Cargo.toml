[package]
name = "veac-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "veac"
path = "src/main.rs"

[dependencies]
veac-ir = { path = "../veac-ir" }
veac-lang = { path = "../veac-lang" }
veac-plan = { path = "../veac-plan" }
veac-codegen = { path = "../veac-codegen" }
veac-runtime = { path = "../veac-runtime" }
veac-project = { path = "../veac-project" }
veac-build = { path = "../veac-build" }
veac-evidence = { path = "../veac-evidence" }
veac-artifact = { path = "../veac-artifact" }
veac-provider = { path = "../veac-provider" }
veac-caption = { path = "../veac-caption" }
veac-otio = { path = "../veac-otio" }
veac-template = { path = "../veac-template" }
clap = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
tempfile = "3"
unicode-normalization = "0.1"
rustix = { version = "1", features = ["fs"] }
getrandom = "0.4"

[dev-dependencies]
assert_cmd = "2"
png = "0.17"
predicates = "3"

[build-dependencies]
sha2 = "0.10"
