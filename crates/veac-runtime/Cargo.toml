[package]
name = "veac-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
veac-artifact = { path = "../veac-artifact" }
veac-codegen = { path = "../veac-codegen" }
veac-ir = { path = "../veac-ir" }
veac-provider = { path = "../veac-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
veac-lang = { path = "../veac-lang" }
veac-plan = { path = "../veac-plan" }
