name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust module structure
        run: bash scripts/check-rust-structure.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  coverage:
    name: Test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      - name: Install FFmpeg 8.0
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "8.0"

      - name: Verify FFmpeg baseline
        run: |
          ffmpeg -version | head -n 1 | grep -E '^ffmpeg version n?8[.]0([ .-]|$)'
          ffprobe -version | head -n 1 | grep -E '^ffprobe version n?8[.]0([ .-]|$)'

      - name: Install cargo-llvm-cov 0.8.4
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov@0.8.4

      - name: Gate package-owned unit targets
        run: bash scripts/coverage.sh packages

      - name: Run full suite with coverage
        run: bash scripts/coverage.sh workspace target/coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: target/coverage/lcov.info
          if-no-files-found: warn

  ffmpeg-integration:
    name: FFmpeg integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      - name: Install FFmpeg 8.0
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "8.0"

      - name: Verify FFmpeg baseline
        run: |
          ffmpeg -version | head -n 1 | grep -E '^ffmpeg version n?8[.]0([ .-]|$)'
          ffprobe -version | head -n 1 | grep -E '^ffprobe version n?8[.]0([ .-]|$)'

      - name: Run FFmpeg-backed integration tests
        run: make e2e

      - name: Build every example preview
        run: make build-examples

      - name: Upload example previews
        uses: actions/upload-artifact@v4
        with:
          name: example-previews
          path: examples-preview/
          if-no-files-found: error
